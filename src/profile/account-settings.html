<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/logos/main-logo.svg">
    <link rel="stylesheet" href="/style.css">
    <title>Account Settings | Codify</title>
    <style>
        body {
            background-color: #0a0f1c;
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: inherit;
        }

        .settings-container {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .settings-card {
            background: rgba(13, 27, 42, 0.5);
            border: 1px solid rgba(0, 170, 255, 0.2);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            margin-bottom: 24px;
        }

        .settings-card h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 170, 255, 0.15);
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cfd8dc;
            margin-bottom: 8px;
        }

        .settings-input {
            width: 100%;
            background: rgba(10, 15, 28, 0.6);
            border: 1px solid rgba(0, 170, 255, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .settings-input:focus {
            outline: none;
            border-color: #00aaff;
            box-shadow: 0 0 12px rgba(0, 170, 255, 0.25);
        }

        .btn-primary {
            background: linear-gradient(90deg, #0077ff, #00aaff);
            border: none;
            color: #fff;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 170, 255, 0.4);
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>

<body>

    <header class="codify-main-header">
        <div class="codify-header-container">
            <div class="codify-left-group">
                <div class="codify-logo" onclick="window.location.href='/'">Codify</div>
            </div>
            <nav class="codify-center-nav">
                <ul class="codify-nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="/src/course.html">Courses</a></li>
                </ul>
            </nav>
            <div class="codify-right-group">
                <div class="codify-auth-group" id="authNavGroup"></div>
            </div>
        </div>
    </header>

    <main class="settings-container">
        <div class="settings-card">
            <h2>Security & Password</h2>
            <div id="passwordAlert" class="alert-box"></div>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="newPassword">NEW PASSWORD</label>
                    <input type="password" id="newPassword" class="settings-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Update Password</button>
            </form>
        </div>
    </main>

    <script type="module">
        import { supabase } from '/supabase-client.js';

        const alertBox = document.getElementById('passwordAlert');

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;

            try {
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                alertBox.style.display = 'block';
                alertBox.style.background = 'rgba(16, 185, 129, 0.15)';
                alertBox.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                alertBox.style.color = '#34d399';
                alertBox.innerHTML = '✓ Password updated successfully!';
                document.getElementById('passwordForm').reset();
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
                alertBox.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                alertBox.style.color = '#f87171';
                alertBox.innerHTML = `❌ ${err.message}`;
            }
        });
    </script>
    <script type="module" src="/nav-auth.js"></script>
</body>

</html>
