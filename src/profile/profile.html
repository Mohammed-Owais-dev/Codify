<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/src/assets/logos/main-logo.svg">
    <link rel="stylesheet" href="/src/css/style.css">
    <title>Account Settings & Profile | Codify</title>
    <style>
        body {
            background-color: #0a0f1c;
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .profile-container {
            flex: 1;
            max-width: 860px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .profile-card {
            background: rgba(13, 27, 42, 0.65);
            border: 1px solid rgba(0, 170, 255, 0.25);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            position: relative;
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 28px;
            border-bottom: 1px solid rgba(0, 170, 255, 0.15);
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .profile-user-info {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00aaff;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.4);
            background: #0d1b2a;
            flex-shrink: 0;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            cursor: pointer;
            transition: opacity 0.2s ease;
            color: #00aaff;
            font-size: 1.4rem;
        }

        .avatar-container.editable:hover .avatar-overlay {
            opacity: 1;
        }

        .profile-title-group h1 {
            margin: 0 0 6px 0;
            font-size: 1.75rem;
            color: #ffffff;
            font-weight: 800;
        }

        .profile-title-group p {
            margin: 0;
            color: #00aaff;
            font-weight: 700;
            font-size: 1rem;
        }

        .btn-edit-trigger {
            background: rgba(0, 170, 255, 0.15);
            border: 1px solid rgba(0, 170, 255, 0.4);
            color: #00aaff;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .btn-edit-trigger:hover {
            background: #00aaff;
            color: #0d1b2a;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.4);
        }

        .edit-badge-unlocked {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            display: none;
        }

        .section-title {
            font-size: 1.1rem;
            color: #00aaff;
            font-weight: 800;
            margin-top: 32px;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }

        .profile-form-group {
            margin-bottom: 22px;
        }

        .profile-form-group.full-width {
            grid-column: 1 / -1;
        }

        .profile-form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: 8px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .profile-input {
            width: 100%;
            background: rgba(10, 15, 28, 0.5);
            border: 1px solid rgba(0, 170, 255, 0.15);
            border-radius: 12px;
            padding: 13px 16px;
            color: #e0e6ed;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .profile-input:disabled {
            background: rgba(15, 23, 42, 0.4);
            border-color: rgba(255, 255, 255, 0.05);
            color: #64748b;
            cursor: not-allowed;
        }

        .profile-input:not(:disabled):focus {
            outline: none;
            border-color: #00aaff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.3);
            background: rgba(10, 15, 28, 0.95);
            color: #fff;
        }

        textarea.profile-input {
            resize: vertical;
            min-height: 100px;
        }

        .profile-submit-btn {
            background: linear-gradient(90deg, #0077ff, #00aaff);
            border: none;
            color: #fff;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 170, 255, 0.3);
            display: none;
            align-items: center;
            gap: 8px;
        }

        .profile-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 170, 255, 0.5);
        }

        .alert-box {
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: none;
            line-height: 1.5;
        }

        /* MODAL SHARED STYLES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 10, 20, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-card {
            background: #0d1b2a;
            border: 1.5px solid #00aaff;
            border-radius: 24px;
            max-width: 440px;
            width: 100%;
            padding: 32px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 170, 255, 0.35);
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-card h2 {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .modal-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        /* AVATAR GRID SPECIFIC STYLES */
        .avatar-selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 24px;
            /* Custom Scrollbar for Grid */
            scrollbar-width: thin;
            scrollbar-color: #00aaff rgba(10, 15, 28, 0.5);
        }
        
        .avatar-selection-grid::-webkit-scrollbar {
            width: 6px;
        }
        
        .avatar-selection-grid::-webkit-scrollbar-thumb {
            background: #00aaff;
            border-radius: 4px;
        }

        .avatar-option {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            object-fit: cover;
            background: rgba(10, 15, 28, 0.5);
        }

        .avatar-option:hover {
            border-color: #00aaff;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.4);
        }

        .otp-inputs-wrapper {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .otp-digit-input {
            width: 48px;
            height: 56px;
            background: rgba(10, 15, 28, 0.9);
            border: 1.5px solid rgba(0, 170, 255, 0.3);
            border-radius: 12px;
            color: #00aaff;
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            transition: all 0.2s ease;
        }

        .otp-digit-input:focus {
            outline: none;
            border-color: #00aaff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.5);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .btn-modal-primary {
            flex: 1;
            background: linear-gradient(90deg, #0077ff, #00aaff);
            border: none;
            color: #fff;
            padding: 12px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-modal-secondary {
            flex: 1;
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: #94a3b8;
            padding: 12px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header class="codify-main-header">
        <div class="codify-header-container">
            <div class="codify-left-group">
                <div class="codify-logo" onclick="window.location.href='/'">Codify</div>
            </div>
            <nav class="codify-center-nav">
                <ul class="codify-nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="/src/pages/courses.html">Courses</a></li>
                </ul>
            </nav>
            <div class="codify-right-group">
                <div class="codify-auth-group" id="authNavGroup"></div>
            </div>
        </div>
    </header>

    <main class="profile-container">
        <div class="profile-card">
            
            <div class="profile-header">
                <div class="profile-user-info">
                    <div class="avatar-container" id="avatarContainer">
                        <img id="avatarImage" class="avatar-img" src="/src/assets/images/avatars/avatar-1.png" alt="Profile Picture">
                        <div class="avatar-overlay" id="avatarOverlayTrigger">📷</div>
                    </div>
                    <div class="profile-title-group">
                        <h1 id="headerDisplayName">User Profile</h1>
                        <p id="headerUserHandle">@username</p>
                    </div>
                </div>

                <button type="button" class="btn-edit-trigger" id="requestEditOtpBtn">
                    ✏️ Edit Profile
                </button>
                <div class="edit-badge-unlocked" id="unlockedBadge">
                    🔓 Edit Mode Unlocked
                </div>
            </div>

            <div id="statusAlert" class="alert-box"></div>

            <form id="profileForm">
                
                <div class="section-title">👤 Personal Information</div>
                
                <div class="profile-grid">
                    <div class="profile-form-group">
                        <label for="firstNameInput">First Name</label>
                        <input type="text" id="firstNameInput" class="profile-input" placeholder="First Name" disabled required>
                    </div>

                    <div class="profile-form-group">
                        <label for="lastNameInput">Last Name</label>
                        <input type="text" id="lastNameInput" class="profile-input" placeholder="Last Name" disabled required>
                    </div>

                    <div class="profile-form-group">
                        <label for="usernameInput">Username Handle</label>
                        <input type="text" id="usernameInput" class="profile-input" placeholder="username" disabled required>
                    </div>

                    <div class="profile-form-group">
                        <label for="emailInput">Email Address</label>
                        <input type="email" id="emailInput" class="profile-input" placeholder="user@example.com" disabled required>
                    </div>
                </div>

                <div class="profile-form-group full-width">
                    <label for="bioInput">About Bio</label>
                    <textarea id="bioInput" class="profile-input" placeholder="Tell us about yourself..." disabled></textarea>
                </div>

                <div style="margin-top: 28px;">
                    <button type="submit" class="profile-submit-btn" id="saveProfileBtn">
                        💾 Save Profile Changes
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div class="modal-overlay" id="otpModal">
        <div class="modal-card">
            <h2>🔐 Verify Identity</h2>
            <p>Enter the 6-digit OTP code sent to <strong id="modalTargetEmail" style="color: #00aaff;"></strong> to unlock profile editing.</p>
            
            <div id="modalAlert" class="alert-box"></div>

            <div class="otp-inputs-wrapper">
                <input type="text" maxlength="1" class="otp-digit-input" autofocus>
                <input type="text" maxlength="1" class="otp-digit-input">
                <input type="text" maxlength="1" class="otp-digit-input">
                <input type="text" maxlength="1" class="otp-digit-input">
                <input type="text" maxlength="1" class="otp-digit-input">
                <input type="text" maxlength="1" class="otp-digit-input">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-modal-secondary" id="closeOtpModalBtn">Cancel</button>
                <button type="button" class="btn-modal-primary" id="verifyOtpBtn">Verify & Unlock</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="avatarModal">
        <div class="modal-card" style="max-width: 500px;">
            <h2>Choose an Avatar</h2>
            <p>Select a profile picture from the gallery below.</p>
            
            <div class="avatar-selection-grid" id="avatarGrid">
                </div>

            <div class="modal-actions">
                <button type="button" class="btn-modal-secondary" id="closeAvatarModalBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from '/src/js/config/supabase-client.js';

        let currentAuthUser = null;
        let isEditUnlocked = false;
        let selectedAvatarUrl = null; // Stores the URL of the chosen avatar

        const alertBox = document.getElementById('statusAlert');
        const modalAlertBox = document.getElementById('modalAlert');
        const otpModal = document.getElementById('otpModal');
        const avatarModal = document.getElementById('avatarModal');

        function showAlert(msg, isError = false) {
            alertBox.style.display = 'block';
            alertBox.style.background = isError ? 'rgba(239, 68, 68, 0.15)' : 'rgba(16, 185, 129, 0.15)';
            alertBox.style.borderColor = isError ? 'rgba(239, 68, 68, 0.3)' : 'rgba(16, 185, 129, 0.3)';
            alertBox.style.color = isError ? '#f87171' : '#34d399';
            alertBox.innerHTML = msg;
        }

        function showModalAlert(msg, isError = false) {
            modalAlertBox.style.display = 'block';
            modalAlertBox.style.background = isError ? 'rgba(239, 68, 68, 0.15)' : 'rgba(16, 185, 129, 0.15)';
            modalAlertBox.style.borderColor = isError ? 'rgba(239, 68, 68, 0.3)' : 'rgba(16, 185, 129, 0.3)';
            modalAlertBox.style.color = isError ? '#f87171' : '#34d399';
            modalAlertBox.innerHTML = msg;
        }

        // Initialize the Avatar Grid Selection
        function initAvatarGrid() {
            const grid = document.getElementById('avatarGrid');
            // Loop from 1 to 20 to generate your preset avatars
            for (let i = 1; i <= 20; i++) {
                const imgUrl = `/src/assets/images/avatars/avatar-${i}.png`;
                const img = document.createElement('img');
                img.src = imgUrl;
                img.className = 'avatar-option';
                img.alt = `Avatar ${i}`;
                
                // When clicked, update the main image and close modal
                img.addEventListener('click', () => {
                    document.getElementById('avatarImage').src = imgUrl;
                    selectedAvatarUrl = imgUrl;
                    avatarModal.style.display = 'none';
                });
                grid.appendChild(img);
            }
        }

        // Load Profile Data Safely
        async function loadProfile() {
            try {
                const { data: { user } } = await supabase.auth.getUser();

                if (!user) {
                    window.location.href = '/src/auth/login.html';
                    return;
                }

                currentAuthUser = user;
                document.getElementById('emailInput').value = user.email || '';

                const { data: profile, error } = await supabase
                    .from('profiles')
                    .select('first_name, last_name, username, bio, avatar_url, display_name')
                    .eq('id', user.id)
                    .maybeSingle();

                if (error && error.code !== 'PGRST116') {
                    console.error('Database Profile Fetch Error:', error);
                }

                const firstName = profile?.first_name || user.user_metadata?.first_name || '';
                const lastName = profile?.last_name || user.user_metadata?.last_name || '';
                const fallbackUsername = user.email ? user.email.split('@')[0] : 'user';
                const username = profile?.username || user.user_metadata?.username || fallbackUsername;
                const bio = profile?.bio || '';
                const avatarUrl = profile?.avatar_url || user.user_metadata?.avatar_url || '/src/assets/images/avatars/avatar-1.png';

                selectedAvatarUrl = avatarUrl; // Store the initial load URL

                document.getElementById('firstNameInput').value = firstName;
                document.getElementById('lastNameInput').value = lastName;
                document.getElementById('usernameInput').value = username;
                document.getElementById('bioInput').value = bio;
                document.getElementById('avatarImage').src = avatarUrl;

                const fullDisplayName = profile?.display_name || `${firstName} ${lastName}`.trim() || username;
                document.getElementById('headerDisplayName').textContent = fullDisplayName;
                document.getElementById('headerUserHandle').textContent = `@${username.toLowerCase().replace(/\s+/g, '')}`;

            } catch (err) {
                console.error('Failed to load user profile:', err);
            }
        }

        // Trigger OTP Email to Unlock Edit Mode
        document.getElementById('requestEditOtpBtn').addEventListener('click', async () => {
            try {
                const { error } = await supabase.auth.signInWithOtp({
                    email: currentAuthUser.email
                });

                if (error) throw error;

                document.getElementById('modalTargetEmail').textContent = currentAuthUser.email;
                otpModal.style.display = 'flex';
                clearOtpInputs();
            } catch (err) {
                console.error('OTP Send Error:', err);
                showAlert(`❌ Unable to send OTP: ${err.message || 'Please check Supabase email settings or rate limits.'}`, true);
            }
        });

        // OTP Input Auto-Advancing UX
        const otpDigitInputs = document.querySelectorAll('.otp-digit-input');
        otpDigitInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpDigitInputs.length - 1) {
                    otpDigitInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpDigitInputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').trim().slice(0, 6);
                pastedData.split('').forEach((char, i) => {
                    if (otpDigitInputs[i]) otpDigitInputs[i].value = char;
                });
            });
        });

        function clearOtpInputs() {
            otpDigitInputs.forEach(i => i.value = '');
            modalAlertBox.style.display = 'none';
        }

        // Verify OTP Code
        document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
            const token = Array.from(otpDigitInputs).map(i => i.value).join('');

            if (token.length !== 6) {
                showModalAlert('Please enter the full 6-digit code.', true);
                return;
            }

            try {
                const { error } = await supabase.auth.verifyOtp({
                    email: currentAuthUser.email,
                    token: token,
                    type: 'email'
                });

                if (error) throw error;

                // Enable Edit Mode
                isEditUnlocked = true;
                otpModal.style.display = 'none';

                // Unlock Inputs
                document.getElementById('firstNameInput').disabled = false;
                document.getElementById('lastNameInput').disabled = false;
                document.getElementById('usernameInput').disabled = false;
                document.getElementById('emailInput').disabled = false;
                document.getElementById('bioInput').disabled = false;

                // Show Avatar Overlay and Save Button
                document.getElementById('avatarContainer').classList.add('editable');
                document.getElementById('requestEditOtpBtn').style.display = 'none';
                document.getElementById('unlockedBadge').style.display = 'inline-block';
                document.getElementById('saveProfileBtn').style.display = 'inline-flex';

                showAlert('🔓 Verification successful! You can now edit your details below.');
            } catch (err) {
                showModalAlert(`❌ ${err.message}`, true);
            }
        });

        // Open Avatar Selection Modal when Overlay is Clicked
        document.getElementById('avatarOverlayTrigger').addEventListener('click', () => {
            if (isEditUnlocked) {
                avatarModal.style.display = 'flex';
            }
        });

        // Close Avatar Modal
        document.getElementById('closeAvatarModalBtn').addEventListener('click', () => {
            avatarModal.style.display = 'none';
        });

        // Submit Profile Save
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!isEditUnlocked) return;

            const firstName = document.getElementById('firstNameInput').value.trim();
            const lastName = document.getElementById('lastNameInput').value.trim();
            const username = document.getElementById('usernameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const bio = document.getElementById('bioInput').value.trim();
            const computedDisplayName = `${firstName} ${lastName}`.trim();

            try {
                // Update Email if changed
                if (email !== currentAuthUser.email) {
                    const { error: emailErr } = await supabase.auth.updateUser({ email });
                    if (emailErr) throw emailErr;
                }

                // Upsert to profiles table, passing selectedAvatarUrl
                const { error: profileErr } = await supabase
                    .from('profiles')
                    .upsert({
                        id: currentAuthUser.id,
                        first_name: firstName,
                        last_name: lastName,
                        display_name: computedDisplayName,
                        username: username,
                        email: email,
                        bio: bio,
                        avatar_url: selectedAvatarUrl, // Using the selected preset avatar
                        updated_at: new Date()
                    });

                if (profileErr) throw profileErr;

                showAlert('✓ Profile details and avatar saved successfully!');
                
                setTimeout(() => {
                    window.location.reload();
                }, 1500);

            } catch (err) {
                console.error('Save Profile Error:', err);
                showAlert(`❌ ${err.message}`, true);
            }
        });

        document.getElementById('closeOtpModalBtn').addEventListener('click', () => {
            otpModal.style.display = 'none';
        });

        // Run On Load
        document.addEventListener('DOMContentLoaded', () => {
            initAvatarGrid();
            loadProfile();
        });
    </script>
    <script type="module" src="/src/js/auth/nav-auth.js"></script>
</body>

</html>
