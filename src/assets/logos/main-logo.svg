<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Midnight Black to Dark Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>

    <!-- 'C' Gradient: Electric Cyan to Deep Tech Blue -->
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0033AA" />
    </linearGradient>

    <!-- Subtle Glow Filter to make the Blue pop -->
    <filter id="glowing" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Smooth Rounded Background Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring/Border Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#0066FF" stroke-width="4" stroke-opacity="0.3" />

  <!-- The "C" Geometry (Styled with a modern, sharp cut) -->
  <path d="M 370,160 
           C 330,120 280,100 220,100 
           C 130,100 70,170 70,256 
           C 70,342 130,412 220,412 
           C 280,412 330,392 370,352 
           L 325,307 
           C 300,330 265,342 220,342 
           C 165,342 135,300 135,256 
           C 135,212 165,170 220,170 
           C 265,170 300,182 325,205 
           Z" 
        fill="url(#cGrad)" 
        filter="url(#glowing)" />
</svg>
