    <style>
        body {
            min-width: 0 !important;
            overflow-x: hidden !important;
            font-family: 'Nunito', sans-serif;
            background-color: #0a0f1c;
            color: #e0e6ed;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            display: flex !important;
            flex-direction: column !important;
            flex: 1;
            margin-top: 90px !important;
            padding: 20px 24px 60px 24px !important;
            max-width: 1100px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
            position: relative !important;
            z-index: 2 !important;
        }

        .index-title {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 800;
            margin: 10px 0 24px 0;
        }

        .index-title span {
            background: linear-gradient(90deg, #0077ff, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-card {
            background: rgba(13, 27, 42, 0.6) !important;
            border: 1px solid rgba(0, 170, 255, 0.25) !important;
            border-radius: 20px !important;
            padding: 24px 28px !important;
            margin-bottom: 30px !important;
            backdrop-filter: blur(16px);
        }

        .progress-top {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            margin-bottom: 14px !important;
        }

        .progress-metrics {
            display: flex !important;
            gap: 12px !important;
        }

        .metric-pill {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 8px;
        }

        .finished {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .pending {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .progress-bar-bg {
            height: 10px;
            background: rgba(10, 15, 28, 0.85);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .chapter-card {
            background: rgba(13, 27, 42, 0.5) !important;
            border: 1px solid rgba(0, 170, 255, 0.2) !important;
            border-radius: 20px !important;
            margin-bottom: 24px !important;
            overflow: hidden !important;
            backdrop-filter: blur(16px);
        }

        .chapter-header {
            padding: 18px 24px;
            background: rgba(10, 15, 28, 0.7);
            font-weight: 800;
            color: #00aaff;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(0, 170, 255, 0.15);
        }

        .topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .topic-item {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            gap: 16px;
        }

        .topic-item:hover {
            background: rgba(0, 170, 255, 0.06);
        }

        .topic-link {
            color: #e0e6ed;
            font-size: 1rem;
            text-decoration: none;
            font-weight: 600;
            flex: 1;
        }

        .topic-link:hover {
            color: #00aaff;
        }

        .status-pill {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 8px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .status-pill.done {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-pill.open {
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .back-courses-btn {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            gap: 8px;
            background: rgba(13, 27, 42, 0.6);
            border: 1px solid rgba(0, 170, 255, 0.25);
            color: #00aaff;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 20px;
            backdrop-filter: blur(16px);
            transition: all 0.3s ease;
        }

        .back-courses-btn:hover {
            background: rgba(0, 170, 255, 0.15);
            border-color: rgba(0, 170, 255, 0.5);
            color: #ffffff;
            transform: translateY(-2px);
        }
    
        @media (max-width: 900px) {
            main { margin-top: 104px !important; padding: 16px 16px 48px !important; }
            .index-title { font-size: clamp(1.8rem, 5.5vw, 2.2rem); line-height: 1.25; }
            .progress-card { padding: 20px; }
            .topic-item { padding: 14px 16px; }
        }
        @media (max-width: 560px) {
            main { margin-top: 112px !important; padding: 12px 12px 36px !important; }
            .back-courses-btn { min-height: 44px; margin-bottom: 16px; }
            .index-title { font-size: 1.65rem; margin: 8px 0 18px; }
            .progress-card { padding: 16px; border-radius: 16px !important; margin-bottom: 20px !important; }
            .progress-top { align-items: flex-start; gap: 12px; flex-direction: column; }
            .progress-metrics { flex-wrap: wrap; gap: 8px !important; }
            .chapter-card { border-radius: 16px !important; margin-bottom: 16px !important; }
            .chapter-header { padding: 15px 16px; font-size: 1rem; line-height: 1.4; }
            .topic-item { align-items: flex-start !important; flex-direction: column; gap: 8px; padding: 14px 16px; }
            .topic-link { font-size: .96rem; line-height: 1.5; overflow-wrap: anywhere; }
            .status-pill { align-self: flex-start; }
        }

    
        /* Mobile spacing polish: move the syllabus up while keeping it clear of the navbar. */
        @media (max-width: 900px) {
            main { margin-top: 92px !important; }
        }
        @media (max-width: 560px) {
            main { margin-top: 96px !important; padding: 10px 12px 32px !important; }
            .index-title { margin-top: 4px !important; }
        }

/* Compact mobile syllabus page with clearer chapter/topic hierarchy */
@media (max-width: 820px) { main { margin-top: 28px !important; } }
@media (max-width: 560px) {
    main { margin-top: 22px !important; padding: 8px 11px 28px !important; }
    .back-courses-btn { margin-bottom: 12px !important; }
    .index-title { font-size: clamp(1.45rem, 7vw, 1.8rem) !important; line-height: 1.25 !important; }
    .progress-card { padding: 14px !important; }
    .chapter-header { gap: 10px; padding: 13px 12px !important; }
    .topic-item { padding: 12px !important; gap: 7px !important; }
    .topic-link { font-size: .94rem !important; line-height: 1.45 !important; }
}


/* Mobile typography scale for course syllabus */
@media (max-width: 820px) {
    .index-title { font-size: clamp(1.4rem, 5.5vw, 1.75rem) !important; }
    .progress-card strong { font-size: .95rem !important; }
    .metric-pill, .status-pill { font-size: .72rem !important; }
    .chapter-header { font-size: .96rem !important; }
    .topic-link { font-size: .9rem !important; line-height: 1.4 !important; }
    .back-courses-btn { font-size: .84rem !important; }
}
@media (max-width: 480px) {
    .index-title { font-size: 1.35rem !important; }
    .progress-card strong { font-size: .88rem !important; }
    .metric-pill, .status-pill { font-size: .68rem !important; }
    .chapter-header { font-size: .9rem !important; }
    .topic-link { font-size: .84rem !important; }
}

</style>
</head>

<body>
    <div id="navbar-placeholder"></div>

    <main>
        <a href="/quick-notes" class="back-courses-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
                >
            </svg>
            Back to Quick Notes
        </a>

        <h1 class="index-title" id="coursePageTitle">Loading Quick Notes...</h1>



        <!-- DYNAMIC CHAPTERS CONTAINER -->
        <div id="syllabusContainer"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/src/js/script.js"></script>
    <script type="module" src="/src/js/components.js"></script>

    <script>
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const language = (pathParts[0] === 'quick-notes' && pathParts[1] ? pathParts[1] : 'c').toLowerCase();
        const syllabusPaths = {
            c: '/src/data/c-syllabus.json',
            cpp: '/src/data/cpp-syllabus.json',
            css: '/src/data/css-syllabus.json',
            html: '/src/data/html-syllabus.json',
            java: '/src/data/java-syllabus.json',
            javascript: '/src/data/javascript-syllabus.json',
            python: '/src/data/python-syllabus.json'
        };

        async function initQuickNotesIndex() {
            const container = document.getElementById('syllabusContainer');
            if (!syllabusPaths[language]) {
                window.location.replace('/quick-notes');
                return;
            }
            try {
                const response = await fetch(syllabusPaths[language]);
                if (!response.ok) throw new Error('Failed to fetch Quick Notes syllabus');
                const syllabus = await response.json();
                const languageName = (syllabus.course_title || language).split(' ')[0];
                document.title = languageName + ' Quick Notes | Codify';
                document.getElementById('coursePageTitle').innerHTML =
                    languageName + ' Programming <span>Quick Notes</span>';

                container.innerHTML = (syllabus.chapters || []).map(chapter => {
                    const number = Number(chapter.chapter_number);
                    return `
                        <section class="chapter-card">
                            <ul class="topic-list">
                                <li class="topic-item">
                                    <a href="/quick-notes/${encodeURIComponent(language)}/${number}" class="topic-link">${number}. ${chapter.chapter_title}</a>
                                    <span class="status-pill open">Chapter ${number}</span>
                                </li>
                            </ul>
                        </section>
                    `;
                }).join('');

                if (!(syllabus.chapters || []).length) {
                    container.innerHTML = '<p>No chapters are configured for this syllabus yet.</p>';
                }
            } catch (error) {
                console.error('Quick Notes index error:', error);
                container.innerHTML = '<section class="chapter-card"><div class="chapter-header">Quick Notes unavailable</div><ul class="topic-list"><li class="topic-item">Could not load the chapter list. Please try again later.</li></ul></section>';
            }
        }
        document.addEventListener('DOMContentLoaded', initQuickNotesIndex);
    </script>
</body>

</html>
