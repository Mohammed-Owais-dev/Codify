<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Master programming languages through structured curriculum tracking on Codify[cite: 7].">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="/src/assets/logos/main-logo.svg">
    <link rel="stylesheet" href="/src/css/global.css">
    <title>Course Syllabus | Codify[cite: 7]</title>
    
    <style>
        body {
            min-width: 1280px !important;
            overflow-x: auto !important;
            font-family: 'Nunito', sans-serif;
            background-color: #0a0f1c;
            color: #e0e6ed;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            display: flex !important;
            flex-direction: column !important;
            flex: 1;
            margin-top: 90px !important;
            padding: 20px 24px 60px 24px !important;
            max-width: 1100px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
            position: relative !important;
            z-index: 2 !important;
        }

        .index-title { 
            color: #ffffff; 
            font-size: 2.2rem; 
            font-weight: 800; 
            margin: 10px 0 24px 0; 
        }
        
        .index-title span { 
            background: linear-gradient(90deg, #0077ff, #00aaff);  
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .progress-card {
            background: rgba(13, 27, 42, 0.6) !important; 
            border: 1px solid rgba(0, 170, 255, 0.25) !important;
            border-radius: 20px !important; 
            padding: 24px 28px !important; 
            margin-bottom: 30px !important; 
            backdrop-filter: blur(16px);
        }

        .progress-top { 
            display: flex !important; 
            justify-content: space-between !important; 
            align-items: center !important; 
            margin-bottom: 14px !important; 
        }

        .progress-metrics { 
            display: flex !important; 
            gap: 12px !important; 
        }

        .metric-pill { 
            font-size: 0.85rem; 
            font-weight: 700; 
            padding: 5px 12px; 
            border-radius: 8px; 
        }

        .finished { 
            background: rgba(16, 185, 129, 0.15); 
            color: #34d399; 
            border: 1px solid rgba(16, 185, 129, 0.3); 
        }

        .pending { 
            background: rgba(245, 158, 11, 0.15); 
            color: #fbbf24; 
            border: 1px solid rgba(245, 158, 11, 0.3); 
        }

        .progress-bar-bg { 
            height: 10px; 
            background: rgba(10, 15, 28, 0.85); 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .progress-bar-fill { 
            height: 100%; 
            width: 0%; 
            background: linear-gradient(90deg, #10b981, #34d399); 
            border-radius: 10px; 
            transition: width 0.5s ease; 
        }

        .chapter-card {
            background: rgba(13, 27, 42, 0.5) !important; 
            border: 1px solid rgba(0, 170, 255, 0.2) !important;
            border-radius: 20px !important; 
            margin-bottom: 24px !important; 
            overflow: hidden !important; 
            backdrop-filter: blur(16px);
        }

        .chapter-header {
            padding: 18px 24px; 
            background: rgba(10, 15, 28, 0.7); 
            font-weight: 800; 
            color: #00aaff; 
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(0, 170, 255, 0.15);
        }

        .topic-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }

        .topic-item {
            display: flex !important; 
            align-items: center !important; 
            justify-content: space-between !important;
            padding: 16px 24px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.04); 
            gap: 16px;
        }

        .topic-item:hover { 
            background: rgba(0, 170, 255, 0.06); 
        }

        .topic-link { 
            color: #e0e6ed; 
            font-size: 1rem; 
            text-decoration: none; 
            font-weight: 600; 
            flex: 1; 
        }

        .topic-link:hover { 
            color: #00aaff; 
        }

        .status-pill { 
            font-size: 0.8rem; 
            font-weight: 700; 
            padding: 5px 12px; 
            border-radius: 8px; 
            white-space: nowrap; 
            transition: all 0.3s ease; 
        }

        .status-pill.done { 
            background: rgba(16, 185, 129, 0.15); 
            color: #34d399; 
            border: 1px solid rgba(16, 185, 129, 0.3); 
        }

        .status-pill.open { 
            background: rgba(148, 163, 184, 0.1); 
            color: #94a3b8; 
            border: 1px solid rgba(148, 163, 184, 0.2); 
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>

    <main>
        <h1 class="index-title" id="coursePageTitle">Loading Course Syllabus...</h1>

        <section class="progress-card">
            <div class="progress-top">
                <strong style="color: #ffffff; font-size: 1.1rem;">Your Course Matrix</strong>
                <div class="progress-metrics">
                    <span class="metric-pill finished" id="finishedMetric">0 Finished</span>
                    <span class="metric-pill pending" id="pendingMetric">0 Incomplete</span>
                </div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </section>

        <!-- DYNAMIC CHAPTERS CONTAINER -->
        <div id="syllabusContainer"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/src/js/components.js"></script>
    <script src="/src/js/script.js"></script>
    <script type="module" src="/src/js/auth/nav-auth.js"></script>
    <script type="module" src="/src/js/config/supabase-client.js"></script>

    <script type="module">
        import { supabase } from '/src/js/config/supabase-client.js';

        const urlParams = new URLSearchParams(window.location.search);
        const pathParts = window.location.pathname.split('/').filter(Boolean);

        const courseParam =
            pathParts[0] === 'courses' && pathParts[1]
                ? pathParts[1].toLowerCase()
                : (window.__RESOLVED_COURSE || urlParams.get('course') || 'c').toLowerCase();
        
        const courseConfigMap = {
            'c': { id: 'c-101', enrollPage: '/src/pages/courses/c/c-enroll.html', jsonPath: '/src/data/c-syllabus.json' },
            'python': { id: 'python-101', enrollPage: '/src/pages/courses/python/python-enroll.html', jsonPath: '/src/data/python-syllabus.json' },
            'cpp': { id: 'cpp-101', enrollPage: '/src/pages/courses/cpp/cpp-enroll.html', jsonPath: '/src/data/cpp-syllabus.json' },
            'java': { id: 'java-101', enrollPage: '/src/pages/courses/java/java-enroll.html', jsonPath: '/src/data/java-syllabus.json' },
            'html': { id: 'html-101', enrollPage: '/src/pages/courses/html/html-enroll.html', jsonPath: '/src/data/html-syllabus.json' }
        };

        const activeCourse = courseConfigMap[courseParam];

        if (!activeCourse) {
            window.location.replace('/src/pages/courses.html');
            throw new Error(`Unknown course: ${courseParam}`);
        }

        const COURSE_ID = activeCourse.id;

        function normalizePath(path) {
            if (!path) return '';
            return path.replace(/^\/+/, '').trim();
        }

        async function initPage() {
            try {
                const response = await fetch(activeCourse.jsonPath);
                if (!response.ok) throw new Error('Failed to fetch course syllabus configuration');
                const syllabusData = await response.json();

                document.title = `${syllabusData.course_title.split(' ')[0]} Syllabus | Codify[cite: 7]`;
                document.getElementById('coursePageTitle').innerHTML = `${syllabusData.course_title.split(' ')[0]} Programming <span>Course Index &amp; Syllabus</span>`;

                const container = document.getElementById('syllabusContainer');
                let htmlContent = '';
                let totalTopicsCount = 0;

                syllabusData.chapters.forEach(chapter => {
                    htmlContent += `
                        <section class="chapter-card">
                            <div class="chapter-header">${chapter.chapter_title}</div>
                            <ul class="topic-list">
                    `;
                    chapter.topics.forEach(topic => {
                        totalTopicsCount++;
                        const lessonId = topic.id || topic.file.split('/').pop().split('-')[0];

                        htmlContent += `
                            <li class="topic-item">
                                <a href="/courses/${courseParam}/${lessonId}" class="topic-link">${topic.title}</a>
                                <span class="status-pill open" data-topic="${topic.file}">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><circle cx="12" cy="12" r="9"></circle></svg> Incomplete
                                </span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul></section>`;
                });

                container.innerHTML = htmlContent;

                const { data: { session } } = await supabase.auth.getSession();
                const user = session?.user;

                let finishedCount = 0;

                if (user) {
                    const { data: progress, error } = await supabase
                        .from('user_progress')
                        .select('lesson_id, completed')
                        .eq('user_id', user.id)
                        .eq('course_id', COURSE_ID);

                    if (!error && progress && progress.length > 0) {
                        const completedSet = new Set(
                            progress.filter(p => p.completed).map(p => normalizePath(p.lesson_id))
                        );

                        document.querySelectorAll('.status-pill[data-topic]').forEach(badge => {
                            const topicKey = normalizePath(badge.getAttribute('data-topic'));
                            const isDone = Array.from(completedSet).some(comp => comp.includes(topicKey) || topicKey.includes(comp));

                            if (isDone) {
                                finishedCount++;
                                badge.className = 'status-pill done';
                                badge.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> Finished';
                            } else {
                                badge.className = 'status-pill open';
                                badge.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><circle cx="12" cy="12" r="9"></circle></svg> Incomplete';
                            }
                        });
                    }
                }

                const pendingCount = Math.max(0, totalTopicsCount - finishedCount);
                const percentage = totalTopicsCount > 0 ? Math.round((finishedCount / totalTopicsCount) * 100) : 0;

                const finishedEl = document.getElementById('finishedMetric');
                const pendingEl = document.getElementById('pendingMetric');
                const progressFill = document.getElementById('progressBarFill');

                if (finishedEl) finishedEl.textContent = `${finishedCount} Finished`;
                if (pendingEl) pendingEl.textContent = `${pendingCount} Incomplete`;
                if (progressFill) progressFill.style.width = `${percentage}%`;

            } catch (err) {
                console.error('Initialization error:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>

</html>
