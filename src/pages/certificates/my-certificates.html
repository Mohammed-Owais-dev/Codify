<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Certificates</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Blue & Black Professional Theme */
            --bg-base: #0B1121;
            --bg-surface: #151E32;
            --bg-hover: #1E293B;
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            padding: 2rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- Main Container --- */
        .page-container {
            width: 100%;
            max-width: 800px;
        }

        .page-header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
        }

        .page-header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* --- Certificate List --- */
        .certificate-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .list-item {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .list-item:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .icon-box {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .item-text h3 {
            font-size: 1.125rem;
            margin-bottom: 0.25rem;
        }

        .item-text p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .view-btn {
            color: var(--primary);
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* --- Empty / Motivational State --- */
        .empty-state {
            background: var(--bg-surface);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 4rem 2rem;
            text-align: center;
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease;
        }

        .empty-state.active {
            display: flex;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: rgba(59, 130, 246, 0.1);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
        }

        .empty-state p {
            color: var(--text-muted);
            max-width: 400px;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        /* --- Modal Viewer --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 17, 33, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-surface);
            width: 95%;
            max-width: 1000px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-surface);
        }

        .modal-header h2 {
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #EF4444;
        }

        /* --- PDF Viewer --- */
        .pdf-viewer {
            flex-grow: 1;
            background: #2A3649;
            position: relative;
        }

        .pdf-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- Action Buttons --- */
        .modal-footer {
            padding: 1.25rem 1.5rem;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <header class="page-header">
            <h1>My Achievements</h1>
            <p>View, print, and download your earned course certificates.</p>
        </header>

        <div id="certificate-list" class="certificate-list">
            </div>

        <div id="empty-state" class="empty-state">
            <div class="empty-icon">🚀</div>
            <h3>No Certificates Yet</h3>
            <p>Great things take time. Keep pushing forward, complete your first course, and your achievements will appear right here!</p>
            <a class="btn btn-primary" href="/courses">Continue Learning</a>
        </div>
    </div>

    <div class="modal-overlay" id="certificateModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Certificate</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            
            <div class="pdf-viewer">
                <iframe id="pdfIframe" src="" title="Certificate PDF"></iframe>
            </div>

            <div class="modal-footer">
                <button class="btn btn-outline" id="printBtn">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print
                </button>
                <button class="btn btn-primary" id="downloadBtn">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download PDF
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from '/src/js/config/supabase-client.js';

        const listContainer = document.getElementById('certificate-list');
        const emptyState = document.getElementById('empty-state');
        const courseNames = {
            c: 'C Programming',
            cpp: 'C++',
            python: 'Python',
            java: 'Java',
            html: 'HTML',
            css: 'CSS',
            javascript: 'JavaScript'
        };

        function getCourseName(courseId) {
            const slug = String(courseId || '').split('-')[0].toLowerCase();
            return courseNames[slug] || slug.toUpperCase() || 'Course';
        }

        function formatDate(value) {
            if (!value) return 'Date unavailable';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? 'Date unavailable' :
                date.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function showEmpty(message, showLogin = false) {
            listContainer.replaceChildren();
            listContainer.style.display = 'none';
            emptyState.classList.add('active');
            const heading = emptyState.querySelector('h3');
            const paragraph = emptyState.querySelector('p');
            const action = emptyState.querySelector('a');
            if (heading) heading.textContent = showLogin ? 'Log In to View Certificates' : 'No Certificates Yet';
            if (paragraph) paragraph.textContent = message;
            if (action) {
                action.href = showLogin ? '/login' : '/courses';
                action.textContent = showLogin ? 'Log In' : 'Continue Learning';
            }
        }

        function renderCertificates(certificates) {
            listContainer.replaceChildren();
            emptyState.classList.remove('active');
            listContainer.style.display = 'flex';

            certificates.forEach(cert => {
                const course = getCourseName(cert.course_id);
                const item = document.createElement('a');
                item.className = 'list-item';
                item.href = '/certificate?id=' + encodeURIComponent(cert.id);
                item.style.textDecoration = 'none';
                item.setAttribute('aria-label', 'View ' + course + ' certificate');

                const info = document.createElement('div');
                info.className = 'item-info';
                const icon = document.createElement('div');
                icon.className = 'icon-box';
                icon.textContent = '✓';
                const text = document.createElement('div');
                text.className = 'item-text';
                const title = document.createElement('h3');
                title.textContent = course + ' Certificate';
                const date = document.createElement('p');
                date.textContent = 'Issued on ' + formatDate(cert.issued_at);
                const id = document.createElement('p');
                id.textContent = 'Certificate ID: ' + cert.id;
                text.append(title, date, id);
                info.append(icon, text);

                const view = document.createElement('span');
                view.className = 'view-btn';
                view.textContent = cert.revoked || cert.revoked_at ? 'View Status' : 'View Certificate';
                item.append(info, view);
                listContainer.append(item);
            });
        }

        async function initCertificatesPage() {
            try {
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) throw sessionError;
                if (!session?.user) {
                    showEmpty('Log in to see certificates earned from your Codify account.', true);
                    return;
                }

                const { data, error } = await supabase.rpc('my_certificates');
                if (error) throw error;
                const certificates = Array.isArray(data) ? data : [];
                if (!certificates.length) {
                    showEmpty('Complete a course exam and meet the passing score to see your certificate here.');
                    return;
                }
                renderCertificates(certificates);
            } catch (error) {
                console.error('Could not load certificates:', error);
                showEmpty('Your certificates could not be loaded. Please refresh the page and try again.');
            }
        }

        initCertificatesPage();
    </script>
</body>
</html>
